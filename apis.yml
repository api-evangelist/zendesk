aid: zendesk
url: https://raw.githubusercontent.com/api-evangelist/zendesk/refs/heads/main/apis.yml
apis:
- aid: zendesk:help-center-articles
  name: Zendesk Help Center Articles API
  tags:
  - Articles
  - Help Center
  - Knowledge Base
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/articles/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/articles/
    type: Documentation
  description: >-
    The Zendesk Help Center Articles API lets you programmatically manage knowledge base articles in your
    Help Center. You can create, read, update, and delete articles, manage their translations, set user
    segment permissions for viewing access, and organize articles within sections. The API supports searching
    articles, managing article labels, and controlling article visibility for agents and end users.
- aid: zendesk:help-center-sections
  name: Zendesk Help Center Sections API
  tags:
  - Help Center
  - Knowledge Base
  - Sections
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/sections/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/sections/
    type: Documentation
  description: >-
    The Zendesk Help Center Sections API lets you create, read, update, and delete sections within your
    Help Center categories. Sections organize articles into logical groups and support multiple translations.
    You can specify user segment permissions to control viewing access and manage the ordering and placement
    of sections within categories.
- aid: zendesk:help-center-categories
  name: Zendesk Help Center Categories API
  tags:
  - Categories
  - Help Center
  - Knowledge Base
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/categories/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/categories/
    type: Documentation
  description: >-
    The Zendesk Help Center Categories API lets you programmatically manage the top-level organizational
    structure of your knowledge base. You can create, read, update, and delete categories, specify names
    and locales, and optionally define multiple translations for each category to support multilingual
    Help Centers.
- aid: zendesk:help-center-translations
  name: Zendesk Help Center Translations API
  tags:
  - Help Center
  - Localization
  - Translations
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/translations/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/translations/
    type: Documentation
  description: >-
    The Zendesk Help Center Translations API lets you manage multilingual content for articles, sections,
    and categories. You can create, read, update, and delete translations for Help Center content, list
    available locales, and check which translations are missing, enabling automated localization workflows
    and integration with external translation management systems.
- aid: zendesk:help-center-article-attachments
  name: Zendesk Help Center Article Attachments API
  tags:
  - Articles
  - Attachments
  - Help Center
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: >-
    https://developer.zendesk.com/api-reference/help_center/help-center-api/article_attachments/
  properties:
  - url: >-
      https://developer.zendesk.com/api-reference/help_center/help-center-api/article_attachments/
    type: Documentation
  description: >-
    The Zendesk Help Center Article Attachments API lets you manage file attachments associated with Help
    Center articles. You can upload new attachments, list existing ones for an article, and delete attachments
    that are no longer needed. The API supports multipart form data uploads for images, documents, and
    other file types used in knowledge base content.
- aid: zendesk:help-center-article-comments
  name: Zendesk Help Center Article Comments API
  tags:
  - Articles
  - Comments
  - Help Center
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: >-
    https://developer.zendesk.com/api-reference/help_center/help-center-api/article_comments/
  properties:
  - url: >-
      https://developer.zendesk.com/api-reference/help_center/help-center-api/article_comments/
    type: Documentation
  description: >-
    The Zendesk Help Center Article Comments API lets you manage comments on knowledge base articles.
    Users can provide feedback by adding comments to articles, and the API provides endpoints to list,
    create, update, and delete comments. The user must have a Zendesk account and their requests must
    be authenticated to add comments.
- aid: zendesk:help-center-article-labels
  name: Zendesk Help Center Article Labels API
  tags:
  - Articles
  - Help Center
  - Labels
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/article_labels/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/article_labels/
    type: Documentation
  description: >-
    The Zendesk Help Center Article Labels API lets you manage the labels applied to knowledge base articles.
    Labels help categorize and organize articles for easier discovery. You can list labels on an article,
    add new labels, and remove existing ones, enabling automated content tagging and organization of your
    knowledge base.
- aid: zendesk:help-center-topics
  name: Zendesk Help Center Topics API
  tags:
  - Community
  - Help Center
  - Topics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/topics/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/topics/
    type: Documentation
  description: >-
    The Zendesk Help Center Topics API lets you manage community discussion topics in your Help Center.
    A topic represents a collection of community posts on a subject. You can create, read, update, and
    delete topics, set user segment permissions to control access, and organize community content for
    your users.
- aid: zendesk:help-center-posts
  name: Zendesk Help Center Posts API
  tags:
  - Community
  - Help Center
  - Posts
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/posts/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/posts/
    type: Documentation
  description: >-
    The Zendesk Help Center Posts API lets you manage community posts within Help Center topics. You can
    list all posts, all posts in a given topic, or all posts by a specific user. The API provides endpoints
    to create, read, update, and delete community posts, enabling programmatic management of community
    discussions.
- aid: zendesk:help-center-post-comments
  name: Zendesk Help Center Post Comments API
  tags:
  - Comments
  - Community
  - Help Center
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/post_comments/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/post_comments/
    type: Documentation
  description: >-
    The Zendesk Help Center Post Comments API lets you manage comments on community posts. You can list
    comments on a post, add new comments, update existing comments, and delete comments. This enables
    programmatic moderation and management of community discussions within Help Center.
- aid: zendesk:help-center-votes
  name: Zendesk Help Center Votes API
  tags:
  - Help Center
  - Votes
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/votes/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/votes/
    type: Documentation
  description: >-
    The Zendesk Help Center Votes API lets you access vote data for knowledge base and community content.
    You can list all votes cast by a given user, or all votes cast for a given article, article comment,
    post, or post comment. This enables reporting on content quality and user engagement with your Help
    Center.
- aid: zendesk:help-center-content-subscriptions
  name: Zendesk Help Center Content Subscriptions API
  tags:
  - Help Center
  - Subscriptions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: >-
    https://developer.zendesk.com/api-reference/help_center/help-center-api/content_subscriptions/
  properties:
  - url: >-
      https://developer.zendesk.com/api-reference/help_center/help-center-api/content_subscriptions/
    type: Documentation
  description: >-
    The Zendesk Help Center Content Subscriptions API lets users subscribe to sections, articles, community
    posts, and community topics to receive notifications when content is added or updated. Users are notified
    when articles are added to sections, comments are added to articles or posts, or posts are added to
    topics.
- aid: zendesk:help-center-user-segments
  name: Zendesk Help Center User Segments API
  tags:
  - Help Center
  - Permissions
  - User Segments
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/user_segments/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/user_segments/
    type: Documentation
  description: >-
    The Zendesk Help Center User Segments API lets you manage user segments that control access to Help
    Center content. User segments define groups of users who can view specific articles, sections, or
    topics. You can create, read, update, and delete segments, and apply them to content to restrict or
    grant viewing access based on user attributes.
- aid: zendesk:help-center-permission-groups
  name: Zendesk Help Center Permission Groups API
  tags:
  - Help Center
  - Management
  - Permissions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: >-
    https://developer.zendesk.com/api-reference/help_center/help-center-api/permission_groups/
  properties:
  - url: >-
      https://developer.zendesk.com/api-reference/help_center/help-center-api/permission_groups/
    type: Documentation
  description: >-
    The Zendesk Help Center Permission Groups API lets you manage which agents can create, update, archive,
    and publish articles. A management permission group consists of a set of privileges, each mapped to
    a user segment. This enables fine-grained control over who can manage knowledge base content.
- aid: zendesk:help-center-search
  name: Zendesk Help Center Search API
  tags:
  - Help Center
  - Search
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/help_center/help-center-api/search/
  properties:
  - url: https://developer.zendesk.com/api-reference/help_center/help-center-api/search/
    type: Documentation
  description: >-
    The Zendesk Help Center Search API provides three different search endpoints for finding content in
    your knowledge base. The Search Articles and Search Posts endpoints enable you to search for articles
    and posts respectively, while the Unified Search endpoint allows you to search across articles, posts,
    and external content in a single query.
- aid: zendesk:talk
  name: Zendesk Talk API
  tags:
  - Phone
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/introduction/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/introduction/
    type: Documentation
  description: >-
    The Zendesk Talk API is the reference API for managing Zendesk voice capabilities. It provides endpoints
    for managing phone numbers, digital lines, greetings, greeting categories, IVRs, IVR routes and menus,
    call recordings, agent availabilities, voice settings, call stats, current queue activity, and incremental
    call exports. It is part of the Zendesk v2 API and uses the same authentication and pagination conventions.
- aid: zendesk:talk-phone-numbers
  name: Zendesk Talk Phone Numbers API
  tags:
  - Phone Numbers
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/phone_numbers/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/phone_numbers/
    type: Documentation
  description: >-
    The Zendesk Talk Phone Numbers API lets you manage the phone numbers in your Zendesk voice account.
    You can list existing phone numbers, search for available numbers to purchase, and manage phone number
    configurations for your Talk instance.
- aid: zendesk:talk-greetings
  name: Zendesk Talk Greetings API
  tags:
  - Greetings
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/greetings/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/greetings/
    type: Documentation
  description: >-
    The Zendesk Talk Greetings API lets you manage the greetings used in your Zendesk voice account. Zendesk
    provides default greetings, but you can replace them with custom greetings by uploading mp3 or wav
    files. Greetings are assigned to greeting categories and used in IVR menus and call routing flows.
- aid: zendesk:talk-ivrs
  name: Zendesk Talk IVRs API
  tags:
  - IVR
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/ivrs/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/ivrs/
    type: Documentation
  description: >-
    The Zendesk Talk IVRs API lets you manage Interactive Voice Response systems that use keypad tones
    to route customers to the right agent or department, provide recorded responses for frequently asked
    questions, and deflect calls. IVR is available on Talk Professional and Enterprise plans. The API
    covers IVRs, IVR menus, and IVR routes.
- aid: zendesk:talk-recordings
  name: Zendesk Talk Recordings API
  tags:
  - Recordings
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/recordings/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/recordings/
    type: Documentation
  description: >-
    The Zendesk Talk Recordings API lets you manage call recordings stored by Talk. Recordings are exposed
    in the corresponding ticket in a voice comment. The API provides endpoints to retrieve and delete
    recordings associated with calls, supporting compliance and data retention requirements.
- aid: zendesk:talk-stats
  name: Zendesk Talk Stats API
  tags:
  - Statistics
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/stats/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/stats/
    type: Documentation
  description: >-
    The Zendesk Talk Stats API provides access to call statistics and current queue activity for your
    voice account. You can retrieve agent overview metrics including average talk time, available time,
    and accepted transfers. The current queue activity endpoint provides real-time visibility into call
    volume, wait times, and agent activity.
- aid: zendesk:talk-availabilities
  name: Zendesk Talk Availabilities API
  tags:
  - Availabilities
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/availabilities/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/availabilities/
    type: Documentation
  description: >-
    The Zendesk Talk Availabilities API lets you manage and query agent availability for voice calls.
    It provides information about agent state, call status, and connection method, enabling real-time
    monitoring of which agents are available to take calls and their current activity status.
- aid: zendesk:talk-lines
  name: Zendesk Talk Lines API
  tags:
  - Lines
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/lines/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/lines/
    type: Documentation
  description: >-
    The Zendesk Talk Lines API lets you list the available lines, including both phone numbers and digital
    lines, in your Zendesk voice account. This provides a unified view of all voice communication channels
    configured for your Talk instance.
- aid: zendesk:talk-digital-lines
  name: Zendesk Talk Digital Lines API
  tags:
  - Digital Lines
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/digital_lines/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/digital_lines/
    type: Documentation
  description: >-
    The Zendesk Talk Digital Lines API lets you manage the digital lines in your Zendesk voice account.
    Digital lines enable browser-based calling without traditional phone numbers, providing an additional
    channel for voice communications within your Talk setup.
- aid: zendesk:talk-voice-settings
  name: Zendesk Talk Voice Settings API
  tags:
  - Settings
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-api/voice_settings/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-api/voice_settings/
    type: Documentation
  description: >-
    The Zendesk Talk Voice Settings API lets you view and manage the account settings of your Zendesk
    voice account. It provides endpoints to retrieve and update configuration options that control how
    your Talk instance operates.
- aid: zendesk:talk-partner-edition
  name: Zendesk Talk Partner Edition API
  tags:
  - Partner Edition
  - Talk
  - Voice
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{subdomain}.zendesk.com
  humanURL: https://developer.zendesk.com/api-reference/voice/talk-partner-edition-api/introduction/
  properties:
  - url: https://developer.zendesk.com/api-reference/voice/talk-partner-edition-api/introduction/
    type: Documentation
  description: >-
    The Zendesk Talk Partner Edition API includes a Standard Call Object with endpoints to save, read,
    and update call-related data in Zendesk. It enables telephony partners to integrate their calling
    solutions with Zendesk by providing a standardized way to create and manage call records associated
    with support tickets.
- aid: zendesk:chat-accounts
  name: Zendesk Chat Accounts API
  tags:
  - Accounts
  - Chat
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://www.zopim.com
  humanURL: https://developer.zendesk.com/api-reference/live-chat/chat-api/accounts/
  properties:
  - url: https://developer.zendesk.com/api-reference/live-chat/chat-api/accounts/
    type: Documentation
  description: >-
    The Zendesk Chat Accounts API lets you get or set account information for your Zendesk Chat instance.
    If you created your Zendesk Chat account in Zendesk Support, access to the Chat Accounts and Agents
    APIs is restricted to GET requests. You can still use the other Chat APIs normally.
- aid: zendesk:chat-agents
  name: Zendesk Chat Agents API
  tags:
  - Agents
  - Chat
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://www.zopim.com
  humanURL: https://developer.zendesk.com/api-reference/live-chat/chat-api/agents/
  properties:
  - url: https://developer.zendesk.com/api-reference/live-chat/chat-api/agents/
    type: Documentation
  description: >-
    The Zendesk Chat Agents API lets you get or set agent information for your Zendesk Chat instance.
    If you created your Zendesk Chat account in Zendesk Support, access to the Agents API is restricted
    to GET requests, but you can still use other Chat APIs normally.
- aid: zendesk:chat-visitors
  name: Zendesk Chat Visitors API
  tags:
  - Chat
  - Visitors
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://www.zopim.com
  humanURL: https://developer.zendesk.com/api-reference/live-chat/chat-api/visitors/
  properties:
  - url: https://developer.zendesk.com/api-reference/live-chat/chat-api/visitors/
    type: Documentation
  description: >-
    The Zendesk Chat Visitors API lets you get or set visitor information for your Zendesk Chat instance.
    Visitors represent end users who initiate chat sessions through the Zendesk Chat widget on your website
    or application.
- aid: zendesk:chat-chats
  name: Zendesk Chat Chats API
  tags:
  - Chat
  - Conversations
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://www.zopim.com
  humanURL: https://developer.zendesk.com/api-reference/live-chat/chat-api/chats/
  properties:
  - url: https://developer.zendesk.com/api-reference/live-chat/chat-api/chats/
    type: Documentation
  description: >-
    The Zendesk Chat Chats API provides access to individual chat records with information including agent
    IDs, agent names, department information, chat history, conversions, and goal attributions. You can
    list and search chat transcripts for reporting, compliance, and quality assurance purposes.
- aid: zendesk:chat-departments
  name: Zendesk Chat Departments API
  tags:
  - Chat
  - Departments
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://www.zopim.com
  humanURL: https://developer.zendesk.com/api-reference/live-chat/chat-api/departments/
  properties:
  - url: https://developer.zendesk.com/api-reference/live-chat/chat-api/departments/
    type: Documentation
  description: >-
    The Zendesk Chat Departments API lets you get or set department information for your Chat instance.
    Departments enable you to route chats to specific groups of agents, configure operating hours, and
    organize your chat support by team or function.
- aid: zendesk:chat-shortcuts
  name: Zendesk Chat Shortcuts API
  tags:
  - Chat
  - Shortcuts
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://www.zopim.com
  humanURL: https://developer.zendesk.com/api-reference/live-chat/chat-api/shortcuts/
  properties:
  - url: https://developer.zendesk.com/api-reference/live-chat/chat-api/shortcuts/
    type: Documentation
  description: >-
    The Zendesk Chat Shortcuts API lets you manage canned responses that agents can use during live chat
    conversations. You can list all shortcuts for the account, create new ones, update existing shortcuts,
    and delete them, with support for scoping by departments and agents.
- aid: zendesk:chat-triggers
  name: Zendesk Chat Triggers API
  tags:
  - Chat
  - Triggers
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://www.zopim.com
  humanURL: https://developer.zendesk.com/api-reference/live-chat/chat-api/triggers/
  properties:
  - url: https://developer.zendesk.com/api-reference/live-chat/chat-api/triggers/
    type: Documentation
  description: >-
    The Zendesk Chat Triggers API lets you manage proactive chat triggers that automatically engage visitors
    based on specified conditions. You can list triggers, add new triggers, update, and delete them. Chat
    triggers can be set to run when a visitor loads the chat widget or based on other visitor activity.
