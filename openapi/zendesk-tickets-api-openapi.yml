          example: A sample description.
        priority:
          type: string
          enum:
          - urgent
          - high
          - normal
          - low
          nullable: true
          description: The urgency of the ticket.
          example: urgent
        status:
          type: string
          enum:
          - new
          - open
          - pending
          - hold
          - solved
          - closed
