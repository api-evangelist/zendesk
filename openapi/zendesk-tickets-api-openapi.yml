components:
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded. Check the Retry-After header.
      headers:
        Retry-After:
          description: Number of seconds to wait before making another request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The request was well-formed but could not be processed due to validation errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    PageParam:
      name: page
      in: query
      description: The page number.
      schema:
        type: integer
        default: 1
    TicketId:
      name: ticket_id
      in: path
      required: true
      description: The ID of the ticket.
      schema:
        type: integer
        format: int64
    PerPageParam:
      name: per_page
      in: query
      description: The number of results per page (max 100).
      schema:
        type: integer
        default: 100
        maximum: 100
  schemas:
    TicketRelatedInformation:
      type: object
      properties:
        followup_source_ids:
          type: array
          items:
            type: string
            description: Sources to follow up
        from_archive:
          type: boolean
          description: Is true if the current ticket is archived
        incidents:
          type: integer
          description: A count of related incident occurrences
        jira_issue_ids:
          type: array
          items:
            type: string
            description: Associated jira issues
        topic_id:
          type: string
          description: Related topic in the Web portal (deprecated feature)
          nullable: true
    ListDeletedTicketsResponse:
      type: object
      allOf:
      - type: object
        properties:
          deleted_tickets:
            type: array
            items:
              type: object
              properties:
                actor:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                deleted_at:
                  type: string
                id:
                  type: integer
                previous_state:
                  type: string
                subject:
                  type: string
      - $ref: '#/components/schemas/OffsetPaginationObject'
    ListTicketCollaboratorsResponse:
      type: object
      additionalProperties: true
    CustomField:
      type: object
      description: A custom field key-value pair.
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the custom field.
          example: abc123
        value:
          description: The value of the custom field.
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
          nullable: true
          example: example_value
    JobStatusResponse:
      type: object
      properties:
        job_status:
          $ref: '#/components/schemas/JobStatusObject'
    ListTicketEmailCCsResponse:
      type: object
      additionalProperties: true
    TicketResponse:
      type: object
      properties:
        ticket:
          $ref: '#/components/schemas/TicketObject'
    ListTicketProblemsResponse:
      type: object
      additionalProperties: true
    Attachment:
      type: object
      description: A file attachment.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: abc123
        file_name:
          type: string
          example: example_value
        content_url:
          type: string
          format: uri
          example: https://www.example.com
        content_type:
          type: string
          example: example_value
        size:
          type: integer
          description: The size of the file in bytes.
          example: 10
        thumbnails:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              file_name:
                type: string
              content_url:
                type: string
                format: uri
              content_type:
                type: string
              size:
                type: integer
          example: []
    Via:
      type: object
      description: How the ticket or comment was created.
      properties:
        channel:
          type: string
          description: The channel the ticket or comment came through (e.g., web, email, api, chat, voice).
          example: example_value
        source:
          type: object
          properties:
            from:
              type: object
              additionalProperties: true
            to:
              type: object
              additionalProperties: true
            rel:
              type: string
              nullable: true
          example: example_value
    TicketCreate:
      type: object
      description: Payload for creating a new ticket.
      properties:
        subject:
          type: string
          description: The subject of the ticket.
          example: example_value
        comment:
          type: object
          required:
          - body
          description: The initial comment (description) of the ticket.
          properties:
            body:
              type: string
              description: The body of the comment.
            html_body:
              type: string
              description: The HTML body of the comment.
            public:
              type: boolean
              default: true
              description: Whether the comment is public.
            uploads:
              type: array
              items:
                type: string
              description: Upload tokens for attachments.
          example: example_value
        requester_id:
          type: integer
          format: int64
          description: The ID of the requester.
          example: '500123'
        requester:
          type: object
          description: Requester details for creating a new user inline. Use either requester_id or requester, not both.
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            locale_id:
              type: integer
          example: example_value
        submitter_id:
          type: integer
          format: int64
          description: The ID of the submitter.
          example: '500123'
        assignee_id:
          type: integer
          format: int64
          nullable: true
          description: The ID of the assigned agent.
          example: '500123'
        group_id:
          type: integer
          format: int64
          nullable: true
          description: The ID of the assigned group.
          example: '500123'
        organization_id:
          type: integer
          format: int64
          nullable: true
          example: '500123'
        type:
          type: string
          enum:
          - problem
          - incident
          - question
          - task
          nullable: true
          example: problem
        priority:
          type: string
          enum:
          - urgent
          - high
          - normal
          - low
          nullable: true
          example: urgent
        status:
          type: string
          enum:
          - new
          - open
          - pending
          - hold
          - solved
          default: new
          example: new
        tags:
          type: array
          items:
            type: string
          example: []
        external_id:
          type: string
          nullable: true
          example: '500123'
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomField'
          example: []
        due_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-01-15T10:30:00Z'
        ticket_form_id:
          type: integer
          format: int64
          nullable: true
          example: '500123'
        brand_id:
          type: integer
          format: int64
          nullable: true
          example: '500123'
        collaborator_ids:
          type: array
          items:
            type: integer
            format: int64
          example: []
        email_cc_ids:
          type: array
          items:
            type: integer
            format: int64
          example: user@example.com
        problem_id:
          type: integer
          format: int64
          nullable: true
          example: '500123'
    Comment:
      type: object
      description: A comment on a ticket.
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the comment.
          readOnly: true
          example: abc123
        type:
          type: string
          enum:
          - Comment
          - VoiceComment
          description: The type of the comment.
          readOnly: true
          example: Comment
        body:
          type: string
          description: The plain text body of the comment.
          example: example_value
