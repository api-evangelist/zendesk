          example: '2026-01-15T10:30:00Z'
        created_at:
          type: string
          format: date-time
          description: When the user was created (ISO 8601).
          readOnly: true
          example: '2026-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
