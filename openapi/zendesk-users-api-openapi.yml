components:
  schemas:
    DeletedUsersResponse:
      type: object
      properties:
        deleted_users:
          type: array
          items:
            $ref: '#/components/schemas/DeletedUserObject'
    UserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserObject'
    CountResponse:
      type: object
      properties:
        count:
          type: object
          properties:
            refreshed_at:
              type: string
              format: datetime
            value:
              type: integer
    CurrentUserResponse:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/UserObject'
          - type: object
            properties:
              authenticity_token:
                type: string
                description: CSRF token required by some Zendesk APIs.
                readOnly: true
    JobStatusResponse:
      type: object
      properties:
        job_status:
          $ref: '#/components/schemas/JobStatusObject'
    ComplianceDeletionStatusesResponse:
      type: object
      properties:
        compliance_deletion_statuses:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceDeletionStatusObject'
    UserCreate:
      type: object
      description: Payload for creating a new user.
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the user.
          example: Example Title
        email:
          type: string
          format: email
          description: The user's email address.
          example: user@example.com
        phone:
          type: string
          nullable: true
          description: The user's phone number.
          example: example_value
        role:
          type: string
          enum:
          - end-user
          - agent
          - admin
          default: end-user
          example: end-user
        custom_role_id:
          type: integer
          format: int64
          nullable: true
          example: '500123'
        organization_id:
          type: integer
          format: int64
          nullable: true
          example: '500123'
        external_id:
          type: string
          nullable: true
          example: '500123'
        tags:
          type: array
          items:
            type: string
          example: []
        locale_id:
          type: integer
          nullable: true
          example: '500123'
        time_zone:
          type: string
          nullable: true
          example: example_value
        details:
          type: string
          nullable: true
          example: example_value
        notes:
          type: string
          nullable: true
          example: example_value
        alias:
          type: string
          nullable: true
          example: example_value
        signature:
          type: string
          nullable: true
          example: example_value
        verified:
          type: boolean
          default: false
          example: true
        user_fields:
          type: object
          additionalProperties: true
          example: example_value
    UsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserObject'
    DeletedUserResponse:
      type: object
      properties:
        deleted_user:
          $ref: '#/components/schemas/DeletedUserObject'
    UserUpdate:
      type: object
      description: Payload for updating an existing user.
      properties:
        name:
          type: string
          example: Example Title
        email:
          type: string
          format: email
          example: user@example.com
        phone:
          type: string
          nullable: true
          example: example_value
        role:
          type: string
          enum:
          - end-user
          - agent
          - admin
          example: end-user
        custom_role_id:
          type: integer
          format: int64
          nullable: true
          example: '500123'
        organization_id:
          type: integer
          format: int64
          nullable: true
          example: '500123'
        external_id:
          type: string
          nullable: true
          example: '500123'
        tags:
          type: array
          items:
            type: string
          example: []
        locale_id:
          type: integer
          nullable: true
          example: '500123'
        time_zone:
          type: string
          nullable: true
          example: example_value
        details:
          type: string
          nullable: true
          example: example_value
        notes:
          type: string
          nullable: true
          example: example_value
        alias:
          type: string
          nullable: true
          example: example_value
        signature:
          type: string
          nullable: true
          example: example_value
        suspended:
          type: boolean
          example: true
        user_fields:
          type: object
          additionalProperties: true
          example: example_value
    User:
      type: object
      description: A Zendesk user representing an end user, agent, or admin in the account.
      properties:
        id:
          type: integer
          format: int64
          description: Automatically assigned user ID.
          readOnly: true
          example: abc123
        url:
          type: string
          format: uri
          description: The API URL of the user.
          readOnly: true
          example: https://www.example.com
        name:
          type: string
          description: The name of the user.
          example: Example Title
        email:
          type: string
          format: email
          nullable: true
          description: The primary email address of the user.
          example: user@example.com
        phone:
          type: string
          nullable: true
          description: The primary phone number of the user.
          example: example_value
        photo:
          type: object
          nullable: true
          description: The user's profile photo.
          readOnly: true
          properties:
            id:
              type: integer
              format: int64
            file_name:
              type: string
            content_url:
              type: string
              format: uri
            content_type:
              type: string
            size:
              type: integer
            thumbnails:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  file_name:
                    type: string
                  content_url:
                    type: string
                    format: uri
                  content_type:
                    type: string
                  size:
                    type: integer
          example: example_value
        locale_id:
          type: integer
          nullable: true
          description: The locale ID of the user.
          example: '500123'
        locale:
          type: string
          description: The locale of the user (e.g., en-US).
          readOnly: true
          example: example_value
        time_zone:
          type: string
          nullable: true
          description: The time zone of the user.
          example: example_value
        organization_id:
          type: integer
          format: int64
          nullable: true
          description: The ID of the user's default organization.
          example: '500123'
        role:
          type: string
          enum:
          - end-user
          - agent
          - admin
          description: The role of the user.
          example: end-user
        custom_role_id:
          type: integer
          format: int64
          nullable: true
          description: The custom role ID for agents with custom roles.
          example: '500123'
        verified:
          type: boolean
          description: Whether the user's identity has been verified.
          example: true
        external_id:
          type: string
          nullable: true
          description: An external ID for the user from an integrated system.
          example: '500123'
        tags:
          type: array
          items:
            type: string
          description: Tags applied to the user.
          example: []
        alias:
          type: string
          nullable: true
          description: An alias displayed instead of the agent's name.
          example: example_value
        active:
          type: boolean
          description: Whether the user account is active.
          readOnly: true
          example: true
        shared:
          type: boolean
