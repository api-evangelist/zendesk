openapi: 3.2.0
info:
  title: Zendesk Ticket Skips API
  version: '1.0'
  description: 'Operations tagged Ticket Skips across 2 of this provider''s published API definitions: skips-openapi-original.yml, users-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Ticket Skips
paths:
  /api/v2/skips:
    post:
      operationId: RecordNewSkip
      tags:
      - Ticket Skips
      summary: Zendesk Post Api V2 Skips
      description: 'Record a new ticket skip for the current user.


        #### Allowed For


        * Agents'
      responses:
        '201':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSkipCreation'
              examples:
                default:
                  $ref: '#/components/examples/TicketSkipCreationExample'
  /api/v2/users/{user_id}/skips:
    parameters:
    - $ref: '#/components/parameters/SkipTicketUserId'
    - $ref: '#/components/parameters/TicketSortOrder'
    - $ref: '#/components/parameters/TicketId'
    get:
      operationId: ListTicketSkips
      tags:
      - Ticket Skips
      summary: Zendesk Get Api V2 Users User_id Skips
      description: 'Archived tickets are not included in the response. See

        About archived tickets in

        the Support Help Center.


        #### Pagination


        - Cursor pagination (recommended)

        - Offset pagination


        See Pagination.


        Returns a maximum of 100 records per page.


        #### Allowed For

        * Agents with "View only" or higher reports permissions in Support.

        These permissions are distinct from Explore permissions.

        * Agents retrieving their own skips'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSkipsResponse'
              examples:
                default:
                  $ref: '#/components/examples/TicketSkipResponseExample'
components:
  schemas:
    TicketSkipsResponse:
      type: object
      properties:
        skips:
          type: array
          items:
            $ref: '#/components/schemas/TicketSkipObject'
x-refined-from:
- skips-openapi-original.yml
- users-openapi-original.yml
