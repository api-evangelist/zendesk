openapi: 3.2.0
info:
  title: Zendesk Autocomplete API
  version: '1.0'
  description: 'Operations tagged Autocomplete across 2 of this provider''s published API definitions: autocomplete-openapi-original.yml, tags-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Autocomplete
paths:
  /api/v2/autocomplete/tags:
    parameters:
    - $ref: '#/components/parameters/TagNameFragment'
    get:
      operationId: AutocompleteTags
      tags:
      - Autocomplete
      summary: Zendesk Get Api V2 Autocomplete Tags
      description: 'Returns an array of registered and recent tag names that start with the characters specified in the `name` query parameter. You must specify at least 2 characters.


        #### Pagination


        * Offset pagination only


        See Using Offset Pagination.


        #### Allowed For


        * Agents'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsByObjectIdResponse'
              examples:
                default:
                  $ref: '#/components/examples/TagsAutocompleteResponseExample'
components:
  schemas:
    TagsByObjectIdResponse:
      type: object
      properties:
        tags:
          type: array
          description: An array of strings
          items:
            type: string
      required:
      - tags
x-refined-from:
- autocomplete-openapi-original.yml
- tags-openapi-original.yml
